<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chipping Master V4.8</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --accent: #22c55e;
            --danger: #ef4444;
            --chart-line: #38bdf8;
            --grid: #334155;
            --keypad-bg: #334155;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        h1 { margin: 0 0 10px 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; background: linear-gradient(to right, var(--accent), #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .card { background-color: var(--card-bg); border-radius: 16px; padding: 16px; width: 100%; max-width: 400px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

        /* --- INPUTS --- */
        .input-display { display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 8px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        
        .custom-input { 
            width: 100%; background: #0f172a; border: 2px solid #334155; 
            color: #64748b; padding: 0; height: 50px; border-radius: 8px; font-size: 1.5rem; 
            text-align: center; font-weight: bold; cursor: pointer; transition: all 0.2s;
            caret-color: transparent;
        }
        .custom-input.active-field { border-color: var(--accent); color: white; background: rgba(34, 197, 94, 0.1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }

        /* --- KEYPAD --- */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .key { 
            background: var(--keypad-bg); color: white; border: none; padding: 15px 0; 
            font-size: 1.6rem; font-weight: bold; border-radius: 8px; cursor: pointer; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); touch-action: manipulation;
        }
        .key:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); background: #475569; }
        .key-action { background: #475569; font-size: 1rem; text-transform: uppercase; }
        .key-submit { background: var(--accent); color: #064e3b; grid-column: span 3; margin-top: 5px; }

        /* TABS */
        .tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 10px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 0.85rem; color: #64748b; cursor: pointer; border-radius: 8px; font-weight: 600; }
        .tab.active { background: var(--card-bg); color: white; }
        .hidden { display: none; }

        /* METRICS & VISUALS */
        .metrics-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .metric-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center; }
        .metric-val { font-size: 2rem; font-weight: 800; color: white; line-height: 1; }
        .metric-label { font-size: 0.75rem; color: #94a3b8; margin-top: 5px; text-transform: uppercase; }

        .zone-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .zone-table th { text-align: left; color: #64748b; font-size: 0.7rem; padding-bottom: 8px; border-bottom: 1px solid var(--grid); }
        .zone-table td { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .zone-bar-bg { width: 100%; height: 4px; background: #334155; border-radius: 2px; margin-top: 6px; }
        .zone-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        .chart-container { width: 100%; height: 220px; position: relative; background: #0f172a; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        #heatmapCanvas { width: 100%; height: 100%; }
        svg { width: 100%; height: 100%; }
        text { fill: #64748b; font-size: 10px; font-family: sans-serif; }
        .trend-line { fill: none; stroke: var(--chart-line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .target-line { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4; opacity: 0.5; }

        /* EXPORT BUTTONS */
        .export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #334155; }
        .btn-export { background: #334155; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        
        /* HELP SECTION */
        .help-toggle { background:none; border:none; color:#64748b; width:100%; font-size:0.9rem; cursor:pointer; padding:10px; border: 1px dashed #334155; border-radius: 8px; margin-top:20px;}
        .help-content { display:none; margin-top:15px; color:#94a3b8; font-size:0.85rem; line-height:1.6; text-align:left; }
        .help-rule { margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .help-step { display:flex; gap:10px; margin-bottom:5px; }
        .step-num { color:var(--accent); font-weight:bold; }

        /* --- PROFESSIONAL REPORT PRINT STYLES --- */
        @media print {
            body { background: white; color: black; padding: 0; }
            h1 { color: black; -webkit-text-fill-color: black; background: none; border-bottom: 2px solid black; padding-bottom: 10px; }
            
            /* Hide UI elements */
            .tabs, .keypad, button, .help-toggle, .help-content, .export-row { display: none !important; }
            
            /* Show ALL Content for Report */
            .view-section { display: block !important; }
            #view-input { display: none !important; } /* Hide input form */
            
            /* Styling fixes for print */
            .card { border: none; box-shadow: none; color: black; background: white; page-break-inside: avoid; border-bottom: 1px solid #eee; margin-bottom: 30px; }
            .card-header { color: black; font-weight: bold; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
            .metric-box { background: #f1f5f9; border: 1px solid #ccc; color: black; }
            .metric-val { color: black; }
            
            /* Table Styling */
            .zone-table th { color: black; border-bottom: 1px solid black; }
            .zone-table td { color: black; border-bottom: 1px solid #ccc; }
            .zone-bar-bg { background: #ddd; }
            
            /* Graphs */
            .chart-container { border: 1px solid #ccc; background: white; }
            svg text { fill: black !important; }
            
            #history-list div { color: black !important; border-bottom: 1px solid #eee !important; }
            span { color: black !important; }
        }
    </style>
</head>
<body>

    <h1>Chipping Pro V4.8</h1>

    <div class="tabs">
        <div class="tab active" onclick="setTab('input')">Log</div>
        <div class="tab" onclick="setTab('visuals')">Stats</div>
        <div class="tab" onclick="setTab('history')">History</div>
    </div>

    <div id="view-input" class="view-section">
        <div class="metrics-row">
            <div class="metric-box">
                <div class="metric-val" id="disp-avg-error">--</div>
                <div class="metric-label">Avg Error %</div>
            </div>
            <div class="metric-box">
                <div class="metric-val" id="disp-updown">--</div>
                <div class="metric-label">Up & Down %</div>
            </div>
        </div>
        <div class="card">
            <div class="input-display">
                <div class="input-group">
                    <label>Start</label>
                    <input type="text" id="inp-start" class="custom-input" readonly inputmode="none" onclick="activateField('inp-start')">
                </div>
                <div class="input-group">
                    <label>Leave</label>
                    <input type="text" id="inp-leave" class="custom-input" readonly inputmode="none" onclick="activateField('inp-leave')">
                </div>
                <div class="input-group">
                    <label>Strk</label>
                    <input type="text" id="inp-strokes" class="custom-input" readonly inputmode="none" onclick="activateField('inp-strokes')">
                </div>
            </div>
            <div class="keypad">
                <button class="key" onclick="pressKey(1)">1</button>
                <button class="key" onclick="pressKey(2)">2</button>
                <button class="key" onclick="pressKey(3)">3</button>
                <button class="key" onclick="pressKey(4)">4</button>
                <button class="key" onclick="pressKey(5)">5</button>
                <button class="key" onclick="pressKey(6)">6</button>
                <button class="key" onclick="pressKey(7)">7</button>
                <button class="key" onclick="pressKey(8)">8</button>
                <button class="key" onclick="pressKey(9)">9</button>
                <button class="key key-action" onclick="pressBack()">⌫</button>
                <button class="key" onclick="pressKey(0)">0</button>
                <button class="key key-action" style="background:#3b82f6" onclick="pressNext()">NEXT</button>
                <button class="key key-submit" onclick="addShot()">SAVE SHOT</button>
            </div>
        </div>
        <button class="help-toggle" onclick="toggleHelp()">❓ How to Use</button>
        <div id="help-section" class="help-content card">
            <div class="help-rule">
                <strong>How to Enter Data:</strong><br>
                <div class="help-step"><span class="step-num">1.</span> Tap 'Start' box. It glows GREEN.</div>
                <div class="help-step"><span class="step-num">2.</span> Use keypad to type distance.</div>
                <div class="help-step"><span class="step-num">3.</span> Tap 'NEXT'. Enter Leave and Strokes.</div>
                <div class="help-step"><span class="step-num">4.</span> Tap 'SAVE SHOT'.</div>
            </div>
        </div>
    </div>

    <div id="view-visuals" class="view-section hidden">
        <div class="card">
            <div class="card-header"><span>Dispersion Map</span><span style="font-size:0.7em; color:var(--accent);">Last 50</span></div>
            <div class="chart-container"><canvas id="heatmapCanvas"></canvas></div>
        </div>
        <div class="card">
            <div class="card-header">Error Trend</div>
            <div class="chart-container" id="trend-container"></div>
        </div>
        <div class="card">
            <div class="card-header">Zone Analysis</div>
            <table class="zone-table"><thead><tr><th width="30%">Distance</th><th width="20%">Shots</th><th width="25%">Error %</th><th width="25%">Up & Down</th></tr></thead><tbody id="zone-body"></tbody></table>
        </div>
    </div>

    <div id="view-history" class="view-section hidden">
        <div class="card">
            <div class="card-header">
                <span>History</span>
                <button onclick="clearData()" style="background:none; border:none; color:#ef4444; font-size:0.7em;">RESET</button>
            </div>
            <div id="history-list" style="max-height: 400px; overflow-y: auto;"></div>
            <div class="export-row">
                <button class="btn-export" onclick="shareCSV()">📄 Share CSV (Excel)</button>
                <button class="btn-export" onclick="createFullPDF()">🖨️ Save as PDF</button>
            </div>
        </div>
    </div>

    <script>
        let shots = JSON.parse(localStorage.getItem('golfShotsMasterV4')) || [];
        let activeInputId = 'inp-start';

        // Init
        activateField('inp-start');
        updateUI();

        // --- KEYPAD ---
        function activateField(id) {
            ['inp-start', 'inp-leave', 'inp-strokes'].forEach(f => {
                document.getElementById(f).classList.remove('active-field');
            });
            activeInputId = id;
            document.getElementById(id).classList.add('active-field');
        }
        function pressKey(num) {
            const el = document.getElementById(activeInputId);
            if (el.value.length < 3) { el.value = el.value + num; }
        }
        function pressBack() {
            const el = document.getElementById(activeInputId);
            el.value = el.value.slice(0, -1);
        }
        function pressNext() {
            if (activeInputId === 'inp-start') activateField('inp-leave');
            else if (activeInputId === 'inp-leave') activateField('inp-strokes');
            else if (activeInputId === 'inp-strokes') addShot();
        }

        // --- DATA ---
        function addShot() {
            const start = parseFloat(document.getElementById('inp-start').value);
            const leave = parseFloat(document.getElementById('inp-leave').value);
            const strokes = parseInt(document.getElementById('inp-strokes').value);

            if (!start || isNaN(leave) || !strokes) {
                document.querySelector('.input-display').style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
                setTimeout(() => document.querySelector('.input-display').style.backgroundColor = 'transparent', 200);
                return;
            }

            const now = new Date();
            const hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const h = hours % 12 || 12;
            const m = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${h}:${m} ${ampm}`;

            const errorPct = (leave / start) * 100;
            const newShot = { id: Date.now(), date: now.toLocaleDateString(), time: timeString, start, leave, strokes, errorPct };
            
            shots.unshift(newShot);
            localStorage.setItem('golfShotsMasterV4', JSON.stringify(shots));

            document.getElementById('inp-start').value = '';
            document.getElementById('inp-leave').value = '';
            document.getElementById('inp-strokes').value = '';
            
            activateField('inp-start');
            updateUI();
        }

        function updateUI() {
            const avgErr = shots.length ? (shots.reduce((a, s) => a + s.errorPct, 0) / shots.length) : 0;
            const upDownPct = shots.length ? (shots.filter(s => s.strokes <= 2).length / shots.length * 100) : 0;
            document.getElementById('disp-avg-error').innerText = avgErr.toFixed(1) + '%';
            document.getElementById('disp-updown').innerText = upDownPct.toFixed(0) + '%';
            renderHeatmap(); renderTrendGraph(); renderZoneAnalysis(); renderHistory();
        }

        // --- IPHONE FIX: SMART SHARE ---
        async function shareCSV() {
            let csvContent = "Date,Time,Start,Leave,Strokes,ErrorPct\n";
            shots.forEach(row => {
                csvContent += `${row.date},${row.time || ''},${row.start},${row.leave},${row.strokes},${row.errorPct.toFixed(2)}\n`;
            });

            if (navigator.share) {
                try {
                    const file = new File([csvContent], "chipping_data.csv", { type: "text/csv" });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'Chipping Data',
                            text: 'Here is my chipping practice data.'
                        });
                        return;
                    }
                } catch (err) { console.log("Sharing failed"); }
            }

            // Fallback
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "chipping_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- PDF FULL REPORT ---
        function createFullPDF() {
            // Unhide visual sections for the print dialog
            const visuals = document.getElementById('view-visuals');
            visuals.classList.remove('hidden');
            
            // Give browser time to render canvas before print
            setTimeout(() => {
                alert("IPHONE USERS:\n\n1. Tap the Share icon (Top of screen)\n2. Tap 'Save to Files'");
                window.print();
                // Restore UI after print dialog closes (approximate)
                setTimeout(() => {
                    setTab('history');
                }, 1000);
            }, 300);
        }

        function setTab(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const target = tabs.find(t => t.innerText.toLowerCase().includes(tab === 'input' ? 'log' : (tab === 'visuals' ? 'stats' : 'history')));
            if(target) target.classList.add('active');
            if (tab === 'visuals') { setTimeout(() => { renderHeatmap(); renderTrendGraph(); renderZoneAnalysis(); }, 50); }
        }

        // --- RENDERERS ---
        function renderHeatmap() {
            const canvas = document.getElementById('heatmapCanvas');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            if (canvas.width !== rect.width * dpr) { canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr); }
            const w = rect.width; const h = rect.height; const cx = w / 2; const cy = h / 2;
            ctx.clearRect(0, 0, w, h);
            
            const maxErrorRender = 20; 
            const radiusScale = (Math.min(w, h) / 2) * 0.9;
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;

            [5, 10, 15].forEach(pct => { ctx.beginPath(); ctx.arc(cx, cy, (pct / maxErrorRender) * radiusScale, 0, Math.PI * 2); ctx.stroke(); });

            ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#22c55e'; ctx.stroke();

            shots.slice(0, 50).forEach(s => {
                let r = (s.errorPct / maxErrorRender) * radiusScale;
                if (r > radiusScale) r = radiusScale;
                const angle = (s.id % 360) * (Math.PI / 180);
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                ctx.fillStyle = s.errorPct <= 10 ? '#22c55e' : (s.errorPct <= 15 ? '#eab308' : '#ef4444');
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
            });
        }

        function renderTrendGraph() {
            const container = document.getElementById('trend-container');
            const data = shots.slice(0, 20).reverse();
            if (data.length < 2) { container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:0.8rem;">Need more data...</div>'; return; }
            
            const w = container.clientWidth; const h = container.clientHeight;
            const p = { top: 20, right: 20, bottom: 30, left: 35 };
            const maxVal = Math.max(...data.map(s => s.errorPct), 25);
            const getX = (i) => p.left + (i / (data.length - 1)) * (w - p.left - p.right);
            const getY = (val) => (h - p.bottom) - (val / maxVal) * (h - p.bottom - p.top);
            const points = data.map((s, i) => `${getX(i)},${getY(s.errorPct)}`).join(' ');
            const targetY = getY(10);
            
            const yLabels = [0, 10, 20, Math.floor(maxVal)].map(val => `<text x="${p.left - 5}" y="${getY(val) + 3}" text-anchor="end">${val}%</text><line x1="${p.left}" y1="${getY(val)}" x2="${w}" y2="${getY(val)}" stroke="#334155" stroke-width="1" stroke-dasharray="2" opacity="0.3" />`).join('');
            const dots = data.map((s, i) => `<circle cx="${getX(i)}" cy="${getY(s.errorPct)}" r="3" fill="${s.errorPct<=10?'#22c55e':'#ef4444'}" />`).join('');
            container.innerHTML = `<svg viewBox="0 0 ${w} ${h}">${yLabels}<line x1="${p.left}" y1="${targetY}" x2="${w}" y2="${targetY}" class="target-line" /><text x="${w-10}" y="${targetY - 5}" text-anchor="end" fill="#22c55e" style="font-weight:bold;">GOAL</text><polyline points="${points}" class="trend-line" />${dots}<text x="${w/2}" y="${h-5}" text-anchor="middle">Last ${data.length} Shots</text></svg>`;
        }

        function renderZoneAnalysis() {
            const buckets = [
                { label: '0-5p', min: 0, max: 5, shots: [], color: '#38bdf8' },
                { label: '6-10p', min: 6, max: 10, shots: [], color: '#818cf8' },
                { label: '11-15p', min: 11, max: 15, shots: [], color: '#a78bfa' },
                { label: '16-20p', min: 16, max: 20, shots: [], color: '#c084fc' },
                { label: '21-25p', min: 21, max: 25, shots: [], color: '#d8b4fe' },
                { label: '26-30p', min: 26, max: 30, shots: [], color: '#f0abfc' },
                { label: '31-35p', min: 31, max: 35, shots: [], color: '#f472b6' },
                { label: '36p+', min: 36, max: 999, shots: [], color: '#fb7185' }
            ];
            shots.forEach(s => { const b = buckets.find(b => s.start >= b.min && s.start <= b.max); if(b) b.shots.push(s); });
            const tbody = document.getElementById('zone-body'); tbody.innerHTML = '';
            buckets.forEach(b => {
                if (b.shots.length === 0) return;
                const bAvgErr = b.shots.reduce((a, s) => a + s.errorPct, 0) / b.shots.length;
                const bUpDown = (b.shots.filter(s => s.strokes <= 2).length / b.shots.length) * 100;
                const errColor = bAvgErr < 10 ? '#22c55e' : (bAvgErr < 15 ? '#facc15' : '#ef4444');
                tbody.innerHTML += `<tr><td><div style="font-weight:bold; color:white;">${b.label}</div></td><td style="color:#94a3b8">${b.shots.length}</td><td style="color:${errColor}; font-weight:bold;">${bAvgErr.toFixed(1)}%</td><td>${bUpDown.toFixed(0)}%</td></tr><tr><td colspan="4" style="padding:0 0 12px 0; border:none;"><div class="zone-bar-bg"><div class="zone-bar-fill" style="width:${bUpDown}%; background:${b.color}"></div></div></td></tr>`;
            });
            if (shots.length === 0) tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#64748b">No Data</td></tr>';
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = shots.map(s => `
                <div style="display:flex; flex-direction:column; padding:10px 0; border-bottom:1px solid #334155; font-size:0.85rem;">
                    <div style="font-size:0.7rem; color:#64748b; margin-bottom:4px;">${s.date} ${s.time ? '<span style="opacity:0.6">@</span> ' + s.time : ''}</div>
                    <div style="display:flex; justify-content:space-between;">
                        <div><span style="color:#fff; font-weight:bold;">${s.start}p</span> <span style="color:#64748b">to</span> ${s.leave}p</div>
                        <div style="text-align:right"><span style="color:${s.errorPct<=10 ? '#22c55e':'#ef4444'}">${s.errorPct.toFixed(1)}%</span> <span style="color:#64748b; margin-left:8px;">(${s.strokes})</span></div>
                    </div>
                </div>`).join('');
        }

        function toggleHelp() {
            const el = document.getElementById('help-section');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function clearData() { if(confirm("Clear All?")) { localStorage.removeItem('golfShotsMasterV4'); shots=[]; updateUI(); } }
    </script>
</body>
</html>
