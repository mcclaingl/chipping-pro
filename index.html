<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Range Round Max</title>
    <style>
        :root {
            --primary: #2e7d32;
            --accent: #66bb6a;
            --bg: #000000;
            --card: #121212;
            --text: #ffffff;
            --key-bg: #1e1e1e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* SCREENS */
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* HEADER */
        .play-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .header-hole { font-size: 1.1rem; font-weight: bold; color: white; }
        .header-par { font-size: 0.8rem; color: #888; }
        .header-total { 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: var(--accent); 
        }

        /* YARDAGE BOX */
        .yardage-box {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 10px;
            position: relative;
            border: 1px solid #222;
        }
        .shot-counter-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #666;
            font-size: 0.8rem;
            font-weight: bold;
            background: #111;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .main-dist { font-size: 5.5rem; font-weight: 800; line-height: 0.9; margin: 10px 0; color: #fff; }
        .dist-label { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .last-shot-display { font-size: 0.9rem; color: var(--accent); margin-top: 5px; height: 1.2em; }

        /* COMPACT INPUT DISPLAY */
        .input-display {
            background: #111;
            color: var(--accent);
            font-size: 1.8rem;
            text-align: center;
            padding: 5px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-family: monospace;
            border: 1px solid #333;
            height: 40px; /* Fixed small height */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* KEYPAD - FLEX GROW TO FILL SCREEN */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            flex-grow: 1; /* This makes it fill all remaining space */
            margin-bottom: 5px;
        }

        .key {
            background: var(--key-bg);
            color: white;
            font-size: 2rem; /* Big text */
            font-weight: bold;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }
        .key:active { background: #444; }
        .key-go { grid-column: span 1; grid-row: span 2; background: var(--primary); font-size: 1.5rem; }
        .key-go:active { background: #1b5e20; }
        .key-0 { grid-column: span 2; } 
        .key-del { background: #2c1a1a; color: #ef9a9a; font-size: 1.5rem; }
        .key-next { background: #222; color: #888; font-size: 1rem; border: 1px solid #444; line-height: 1.1; }

        /* ADMIN STYLES */
        .course-list { flex-grow: 1; overflow-y: auto; }
        .course-item { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; padding: 15px; width: 100%; font-size: 1.1rem; border:none; border-radius:8px; }
        input { width: 100%; padding: 12px; background: #333; border: 1px solid #555; color: white; margin-bottom: 10px; box-sizing: border-box; }
        
        .exit-btn { width: 100%; background: #111; color: #555; border: none; padding: 10px; font-size: 0.8rem; }

    </style>
</head>
<body>

    <div id="screen-select" class="container screen active">
        <h1 style="text-align:center; color:var(--accent);">Range Round Max</h1>
        <input type="text" id="course-search" placeholder="Search..." onkeyup="renderList()">
        <div id="course-list-container" class="course-list"></div>
        <button class="btn-main" onclick="showAdd()">+ Add New Course</button>
    </div>

    <div id="screen-play" class="container screen">
        
        <div class="play-header">
            <div>
                <div class="header-hole" id="ui-hole">Hole 1</div>
                <div class="header-par" id="ui-par">Par 4</div>
            </div>
            <div style="text-align:right;">
                <div style="font-size:0.6rem; color:#666; text-transform:uppercase;">Total Shots</div>
                <div class="header-total" id="ui-total">0</div>
            </div>
        </div>

        <div class="yardage-box">
            <div class="shot-counter-badge" id="ui-shot-count">Shot 1</div>
            <div class="main-dist" id="ui-dist">400</div>
            <div class="dist-label">Yards Remaining</div>
            <div class="last-shot-display" id="ui-last-shot"></div>
        </div>

        <div class="input-display" id="keypad-display">
            <span style="color:#333; font-size:1rem;">ENTER DISTANCE</span>
        </div>

        <div class="keypad">
            <button class="key" onclick="pad(7)">7</button>
            <button class="key" onclick="pad(8)">8</button>
            <button class="key" onclick="pad(9)">9</button>
            <button class="key key-next" onclick="nextHole()">NEXT<br>HOLE</button>

            <button class="key" onclick="pad(4)">4</button>
            <button class="key" onclick="pad(5)">5</button>
            <button class="key" onclick="pad(6)">6</button>
            <button class="key key-go" onclick="commitShot()">HIT</button> 

            <button class="key" onclick="pad(1)">1</button>
            <button class="key" onclick="pad(2)">2</button>
            <button class="key" onclick="pad(3)">3</button>

            <button class="key key-del" onclick="padDel()">⌫</button>
            <button class="key key-0" onclick="pad(0)">0</button>
        </div>
        
        <button class="exit-btn" onclick="exitRound()">EXIT ROUND</button>
    </div>

    <div id="screen-add" class="container screen">
        <h1 style="text-align:center; color:var(--accent);">Add Course</h1>
        <div style="flex-grow:1; overflow-y:auto;">
            <input type="text" id="new-course-name" placeholder="Course Name">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button style="flex:1; padding:10px; background:#333; color:white; border:none;" onclick="genInputs(9)">9 Holes</button>
                <button style="flex:1; padding:10px; background:#333; color:white; border:none;" onclick="genInputs(18)">18 Holes</button>
            </div>
            <div id="hole-inputs"></div>
        </div>
        <div style="padding-top:10px;">
            <button class="btn-main" onclick="saveCourse()">Save</button>
            <button style="width:100%; background:#333; color:white; padding:15px; margin-top:10px; border:none;" onclick="showSelect()">Cancel</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const famous = [
            { id: 'augusta', name: 'Augusta National', source: 'famous', holes: [ {p:4, d:445}, {p:5, d:575}, {p:4, d:350}, {p:3, d:240}, {p:4, d:495}, {p:3, d:180}, {p:4, d:450}, {p:5, d:570}, {p:4, d:460}, {p:4, d:495}, {p:4, d:520}, {p:3, d:155}, {p:5, d:510}, {p:4, d:440}, {p:5, d:550}, {p:3, d:170}, {p:4, d:440}, {p:4, d:465} ]},
            { id: 'pebble', name: 'Pebble Beach', source: 'famous', holes: [ {p:4, d:377}, {p:5, d:511}, {p:4, d:390}, {p:4, d:326}, {p:3, d:192}, {p:5, d:506}, {p:3, d:106}, {p:4, d:427}, {p:4, d:481}, {p:4, d:446}, {p:4, d:373}, {p:3, d:201}, {p:4, d:403}, {p:5, d:572}, {p:4, d:396}, {p:4, d:401}, {p:3, d:177}, {p:5, d:543} ]}
        ];

        let userCourses = [];
        let activeCourse = null;
        let curHole = 0;
        let dist = 0;
        
        let holeShots = 0;
        let totalScore = 0;
        let buffer = "";

        window.onload = () => {
            if(localStorage.getItem('rp_courses')) userCourses = JSON.parse(localStorage.getItem('rp_courses'));
            renderList();
            genInputs(9);
        };

        // --- KEYPAD ---
        function pad(num) {
            if(buffer.length > 3) return; 
            buffer += num;
            updatePad();
        }
        function padDel() {
            buffer = buffer.slice(0, -1);
            updatePad();
        }
        function updatePad() {
            const el = document.getElementById('keypad-display');
            if(buffer === "") el.innerHTML = '<span style="color:#333; font-size:1rem;">ENTER DISTANCE</span>';
            else el.innerText = buffer;
        }
        function commitShot() {
            if(buffer === "") return;
            const val = parseInt(buffer);
            buffer = "";
            updatePad();
            
            holeShots++;
            totalScore++;
            dist -= val;
            
            // Show last shot feedback
            document.getElementById('ui-last-shot').innerText = `Last: ${val} yds`;
            
            updateUI();
        }

        // --- GAME ---
        function startRound(type, idx) {
            activeCourse = (type === 'user') ? userCourses[idx] : famous.find(c => c.id === idx);
            curHole = 0;
            totalScore = 0;
            loadHole();
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-play').classList.add('active');
        }

        function loadHole() {
            if(curHole >= activeCourse.holes.length) {
                alert(`Round Complete! Total Score: ${totalScore}`);
                showSelect();
                return;
            }
            const h = activeCourse.holes[curHole];
            dist = h.d;
            holeShots = 1; // "Shot 1" is the one we are about to hit
            buffer = "";
            document.getElementById('ui-last-shot').innerText = "";
            updatePad();
            updateUI();
        }

        function updateUI() {
            const h = activeCourse.holes[curHole];
            document.getElementById('ui-hole').innerText = `Hole ${curHole + 1}`;
            document.getElementById('ui-par').innerText = `Par ${h.p} • ${h.d}y`;
            document.getElementById('ui-total').innerText = totalScore;
            document.getElementById('ui-shot-count').innerText = `Shot ${holeShots}`;
            document.getElementById('ui-dist').innerText = Math.abs(dist);
            
            const lbl = document.querySelector('.dist-label');
            if(dist <= 0) {
                lbl.innerText = "Yards Past Pin";
                lbl.style.color = "#ef5350";
            } else {
                lbl.innerText = "Yards Remaining";
                lbl.style.color = "#888";
            }
        }

        function nextHole() {
            curHole++;
            loadHole();
        }

        function exitRound() {
            if(confirm("Exit Round?")) showSelect();
        }

        // --- ADMIN ---
        function renderList() {
            const term = document.getElementById('course-search').value.toLowerCase();
            const box = document.getElementById('course-list-container');
            box.innerHTML = '';
            [...userCourses, ...famous].forEach((c) => {
                if(c.name.toLowerCase().includes(term)) {
                    const isU = c.source === 'user';
                    const fn = isU ? `startRound('user', ${userCourses.indexOf(c)})` : `startRound('famous', '${c.id}')`;
                    box.innerHTML += `<div class="course-item" onclick="${fn}">
                        <div style="font-weight:bold">${c.name}</div>
                        <div style="font-size:0.8rem; color:#888;">${isU?'Saved':'Famous'} • ${c.holes.length} Holes</div>
                    </div>`;
                }
            });
        }
        function showAdd() {
            document.getElementById('screen-select').classList.remove('active');
            document.getElementById('screen-add').classList.add('active');
        }
        function showSelect() {
            document.getElementById('screen-add').classList.remove('active');
            document.getElementById('screen-play').classList.remove('active');
            document.getElementById('screen-select').classList.add('active');
        }
        function genInputs(n) {
            const d = document.getElementById('hole-inputs');
            d.innerHTML = '';
            for(let i=1; i<=n; i++) {
                d.innerHTML += `<div style="display:flex; gap:5px; margin-bottom:5px;">
                    <div style="width:30px; padding-top:10px; color:#888;">${i}</div>
                    <input type="number" placeholder="Par" value="4" style="flex:1;" class="inp-par">
                    <input type="number" placeholder="Yds" style="flex:2;" class="inp-dist">
                </div>`;
            }
        }
        function saveCourse() {
            const name = document.getElementById('new-course-name').value;
            if(!name) return alert("Name required");
            const holes = [];
            const rows = document.getElementById('hole-inputs').children;
            for(let row of rows) {
                const p = row.querySelector('.inp-par').value;
                const d = row.querySelector('.inp-dist').value;
                if(p && d) holes.push({p:parseInt(p), d:parseInt(d)});
            }
            if(holes.length===0) return;
            userCourses.push({id: Date.now().toString(), name, source:'user', holes});
            localStorage.setItem('rp_courses', JSON.stringify(userCourses));
            renderList();
            showSelect();
        }
    </script>
</body>
</html>
